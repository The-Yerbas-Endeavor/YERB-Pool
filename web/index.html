<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YERB Pool</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#111;color:#eee;margin:0}a{color:#9fd3ff;text-decoration:none}a:hover{text-decoration:underline}header{padding:24px;background:#181818;border-bottom:1px solid #2a2a2a}.head{max-width:1200px;margin:auto}.brand{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}nav{display:flex;gap:16px;flex-wrap:wrap}nav a{color:#ddd;font-weight:600}.muted{color:#aaa}.small{font-size:12px}main{max-width:1200px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{display:block;background:#1b1b1b;padding:18px;border:1px solid #2c2c2c;border-radius:10px;color:#eee;transition:.15s ease}.card:hover{border-color:#555;transform:translateY(-1px);text-decoration:none}.card .muted{margin-bottom:4px}.value{font-size:28px;font-weight:700}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center}table{width:100%;border-collapse:collapse;margin-top:12px;background:#181818}th,td{padding:10px;border-bottom:1px solid #2a2a2a;text-align:left;font-size:14px;vertical-align:top}section{margin-top:26px}.table-wrap{overflow-x:auto}code{font-size:12px;word-break:break-all}.badge{display:inline-block;padding:3px 8px;border-radius:999px;border:1px solid #444;background:#222;font-size:12px}.ok{color:#9fe3a7}.bad{color:#ffaaaa}.copy{font-size:11px;margin-left:6px;background:#252525;border:1px solid #444;border-radius:5px;color:#ddd;padding:2px 6px;cursor:pointer}.empty{padding:18px;color:#888;background:#181818;border:1px solid #252525;border-radius:8px}.back{display:inline-block;margin-bottom:14px}.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}.chart-card{background:#181818;border:1px solid #2c2c2c;border-radius:10px;padding:16px;min-width:0}.chart-card h3{margin:0 0 4px}.chart{width:100%;height:240px;display:block;margin-top:12px}.chart text{fill:#999;font-size:10px}.chart .gridline{stroke:#2d2d2d;stroke-width:1}.chart .line-main{fill:none;stroke:#9fd3ff;stroke-width:2}.chart .bar-ok{fill:#9fe3a7}.chart .bar-bad{fill:#ffaaaa}.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.dot.okdot{background:#9fe3a7}.dot.baddot{background:#ffaaaa}.dot.hashdot{background:#9fd3ff}.worker-bar{display:grid;grid-template-columns:minmax(100px,1fr) 3fr auto;gap:12px;align-items:center;margin:10px 0}.worker-bar-track{height:10px;background:#262626;border-radius:999px;overflow:hidden}.worker-bar-fill{height:100%;background:#9fd3ff;border-radius:999px}.metric-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}.metric{background:#151515;border:1px solid #292929;border-radius:8px;padding:12px}.metric strong{display:block;font-size:20px;margin-top:3px}.address-cell{min-width:260px;background:#151915}.address-cell .small{margin-top:5px}@media(max-width:520px){main{padding:14px}.chart-grid{grid-template-columns:1fr}.value{font-size:23px}.worker-bar{grid-template-columns:1fr auto}.worker-bar-track{grid-column:1/-1}}
</style>
</head>
<body>
<header><div class="head"><div class="brand"><div><h1><a href="/" style="color:#eee">YERB Pool</a></h1><div class="muted">GhostRider Mining Pool Dashboard</div></div><nav><a href="/">Dashboard</a><a href="/miners">Miners</a><a href="/workers">Workers</a><a href="/shares">Shares</a><a href="/blocks">Blocks</a><a href="/payouts">Payouts</a><a href="/api/summary">API</a></nav></div></div></header>
<main id="app"></main>
<script>
const EXPLORER='https://explorer.yerbas.org';
const fmt=(n,digits=2)=>{const v=Number(n||0);return Number.isFinite(v)?v.toFixed(digits):(0).toFixed(digits)};
const coin=n=>fmt(Number(n||0)/1e8,2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=s=>{s=String(s||'');return s.length>22?s.slice(0,10)+'…'+s.slice(-10):s};
const when=t=>t?new Date(Number(t)*1000).toLocaleString():'—';
const ago=t=>{if(!t)return'never';const d=Math.max(0,Math.floor(Date.now()/1000-Number(t)));if(d<60)return d+'s ago';if(d<3600)return Math.floor(d/60)+'m ago';if(d<86400)return Math.floor(d/3600)+'h ago';return Math.floor(d/86400)+'d ago'};
const fmtTime=s=>{if(s==null||!isFinite(s))return'—';s=Number(s);if(s<60)return Math.round(s)+' sec';if(s<3600)return(s/60).toFixed(1)+' min';if(s<86400)return(s/3600).toFixed(1)+' hr';return(s/86400).toFixed(1)+' days'};
async function get(u){const r=await fetch(u,{cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);return j}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function status(x){return `<span class="badge">${esc(x||'')}</span>`}
function copyBtn(v){return `<button class="copy" onclick="navigator.clipboard.writeText('${String(v).replace(/'/g,"\\'")}');this.textContent='Copied'">Copy</button>`}
function addressLink(a){return `<a href="/account/${encodeURIComponent(a)}"><code>${esc(a)}</code></a>${copyBtn(a)}`}
function explorerAddress(a){return `<a href="${EXPLORER}/address/${encodeURIComponent(a)}" target="_blank" rel="noopener">Explorer ↗</a>`}
function explorerBlock(h){return h?`<a href="${EXPLORER}/block/${encodeURIComponent(h)}" target="_blank" rel="noopener"><code>${esc(short(h))}</code></a>`:'—'}
function explorerTx(tx){return tx?`<a href="${EXPLORER}/tx/${encodeURIComponent(tx)}" target="_blank" rel="noopener"><code>${esc(short(tx))}</code></a>`:'—'}
function hashRate(v){v=Number(v||0);if(v>=1e9)return(v/1e9).toFixed(2)+' GH/s';if(v>=1e6)return(v/1e6).toFixed(2)+' MH/s';if(v>=1e3)return(v/1e3).toFixed(2)+' kH/s';return v.toFixed(1)+' H/s'}
function lineChart(data,key,formatter=String){const W=720,H=240,L=52,R=12,T=14,B=30,iw=W-L-R,ih=H-T-B;const vals=data.map(x=>Number(x[key]||0));const max=Math.max(...vals,1);const px=i=>L+(data.length<=1?0:i/(data.length-1))*iw;const py=v=>T+ih-Number(v)/max*ih;const pts=data.map((x,i)=>`${px(i).toFixed(1)},${py(x[key]).toFixed(1)}`).join(' ');let grid='';for(let i=0;i<=4;i++){const y=T+ih*i/4,val=max*(1-i/4);grid+=`<line class="gridline" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/><text x="4" y="${y+4}">${esc(formatter(val))}</text>`}const first=data[0]?.ts,last=data[data.length-1]?.ts;return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}<polyline class="line-main" points="${pts}"/><text x="${L}" y="${H-7}">${first?new Date(first*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):''}</text><text text-anchor="end" x="${W-R}" y="${H-7}">${last?new Date(last*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):''}</text></svg>`}
function shareChart(data){const W=720,H=240,L=42,R=12,T=14,B=30,iw=W-L-R,ih=H-T-B;const max=Math.max(...data.map(x=>Number(x.accepted||0)+Number(x.rejected||0)),1);const bw=Math.max(1,iw/Math.max(data.length,1));let bars='';data.forEach((x,i)=>{const a=Number(x.accepted||0),r=Number(x.rejected||0),x0=L+i*bw,ah=a/max*ih,rh=r/max*ih;bars+=`<rect class="bar-ok" x="${x0}" y="${T+ih-ah}" width="${Math.max(.8,bw*.72)}" height="${ah}"/><rect class="bar-bad" x="${x0}" y="${T+ih-ah-rh}" width="${Math.max(.8,bw*.72)}" height="${rh}"/>`});let grid='';for(let i=0;i<=4;i++){const y=T+ih*i/4;grid+=`<line class="gridline" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/><text x="4" y="${y+4}">${Math.round(max*(1-i/4))}</text>`}return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${bars}</svg>`}
function aggregateHistory(stats){const m=new Map();for(const s of stats){for(const p of(s.history||[])){const ts=Number(p.ts),v=m.get(ts)||{ts,hashrate:0,accepted:0,rejected:0};v.hashrate+=Number(p.hashrate||0);v.accepted+=Number(p.accepted||0);v.rejected+=Number(p.rejected||0);m.set(ts,v)}}return[...m.values()].sort((a,b)=>a.ts-b.ts)}
function workerBars(workers){const list=[...workers].sort((a,b)=>Number(b.hashrate||0)-Number(a.hashrate||0)).slice(0,8);if(!list.length)return'<div class="empty">No worker hashrate yet.</div>';const max=Math.max(...list.map(x=>Number(x.hashrate||0)),1);return list.map(x=>`<div class="worker-bar"><div><a href="/worker/${x.id}"><code>${esc(x.name)}</code></a><div class="small muted">${x.active?'Active':'Idle'} · ${x.accepted_shares||0} accepted</div></div><div class="worker-bar-track"><div class="worker-bar-fill" style="width:${Math.max(1,Number(x.hashrate||0)/max*100)}%"></div></div><strong>${hashRate(x.hashrate)}</strong></div>`).join('')}
async function dashboard(){const[s,b,m,p,w,luck]=await Promise.all([get('/api/summary'),get('/api/blocks?limit=10'),get('/api/miners?limit=10'),get('/api/payouts?limit=10'),get('/api/workers?limit=50'),get('/api/luck').catch(()=>null)]);const active=w.filter(x=>x.active).slice(0,24);const stats=(await Promise.all(active.map(x=>get('/api/worker/'+x.id+'/stats?hours=24&bucket=300').catch(()=>null)))).filter(Boolean);const h=aggregateHistory(stats);const accepted24=h.reduce((n,x)=>n+Number(x.accepted||0),0),rejected24=h.reduce((n,x)=>n+Number(x.rejected||0),0);const peak=h.reduce((n,x)=>Math.max(n,Number(x.hashrate||0)),0);const current=w.reduce((n,x)=>n+Number(x.active?x.hashrate:0),0);const cards=[['Miners',s.accounts.accounts,'/miners'],['Active Workers',s.workers.active_workers,'/workers'],['Pool Hashrate',hashRate(luck?.pool_hashrate||current),'/workers'],['Accepted Shares',s.shares.accepted,'/shares?status=accepted'],['Rejected Shares',s.shares.rejected,'/shares?status=rejected'],['Blocks Found',s.blocks.blocks,'/blocks'],['Pending Blocks',s.blocks.pending,'/blocks/pending'],['Pool Balance',coin(s.accounts.balance_atomic)+' YERB','/miners'],['Immature',coin(s.accounts.immature_atomic)+' YERB','/miners'],['Total Paid',coin(s.payouts.paid_atomic)+' YERB','/payouts']];app.innerHTML=`<div class="grid">${cards.map(x=>`<a class="card" href="${x[2]}"><div class="muted">${x[0]}</div><div class="value">${x[1]}</div></a>`).join('')}</div><section><div class="section-head"><div><h2 style="margin-bottom:4px">Pool Activity — last 24 hours</h2><div class="muted">Accepted GhostRider share work from currently tracked workers.</div></div><a href="/workers">Workers →</a></div><div class="metric-strip"><div class="metric"><span class="muted small">Current pool hashrate</span><strong>${hashRate(luck?.pool_hashrate||current)}</strong></div><div class="metric"><span class="muted small">24h peak hashrate</span><strong>${hashRate(peak)}</strong></div><div class="metric"><span class="muted small">Accepted shares / 24h</span><strong>${accepted24.toLocaleString()}</strong></div><div class="metric"><span class="muted small">Rejected shares / 24h</span><strong>${rejected24.toLocaleString()}</strong></div>${luck?`<div class="metric"><span class="muted small">Network difficulty</span><strong>${Number(luck.network_difficulty||0).toPrecision(5)}</strong></div><div class="metric"><span class="muted small">Estimated block time</span><strong>${fmtTime(luck.eta_seconds)}</strong></div>`:''}</div><div class="chart-grid" style="margin-top:16px"><div class="chart-card"><h3>Pool Hashrate</h3><div class="muted small">24-hour estimated hashrate in 5-minute buckets.</div>${h.length?lineChart(h,'hashrate',hashRate):'<div class="empty">Waiting for enough accepted-share history.</div>'}<div class="legend"><span><i class="dot hashdot"></i>Pool hashrate</span></div></div><div class="chart-card"><h3>Share Activity</h3><div class="muted small">Accepted and rejected shares in 5-minute buckets.</div>${h.length?shareChart(h):'<div class="empty">Waiting for share history.</div>'}<div class="legend"><span><i class="dot okdot"></i>Accepted</span><span><i class="dot baddot"></i>Rejected</span></div></div></div></section><section><div class="section-head"><div><h2 style="margin-bottom:4px">Top Workers</h2><div class="muted">Ranked by recent 10-minute estimated hashrate.</div></div><a href="/workers">View all →</a></div><div class="chart-card" style="margin-top:12px">${workerBars(w)}</div></section><section><div class="section-head"><h2>Recent Blocks</h2><a href="/blocks">View all →</a></div>${renderBlocks(b)}</section><section><div class="section-head"><h2>Miners</h2><a href="/miners">View all →</a></div>${renderMiners(m)}</section><section><div class="section-head"><h2>Recent Payouts</h2><a href="/payouts">View all →</a></div>${renderPayouts(p)}</section>`}
function renderBlocks(b){if(!b.length)return'<div class="empty">No blocks found yet.</div>';return table(['Height','Status','Confirmations','Block Reward','Hash'],b.map(x=>{const c=Number(x.confirmations||0),required=100,label=(x.status==='orphan'?'Orphan':c>=required?'Confirmed':'Pending');return `<tr><td>${x.height??'—'}</td><td>${status(label)}</td><td>${c} / ${required}</td><td>${coin(x.network_reward_atomic||8000000000)} YERB</td><td>${explorerBlock(x.block_hash)}</td></tr>`}))}
function renderMiners(m){if(!m.length)return'<div class="empty">No miners yet.</div>';return table(['Address','Workers','Accepted','Rejected','Balance','Immature','Total Paid'],m.map(x=>`<tr><td>${addressLink(x.address)}<div class="small">${explorerAddress(x.address)}</div></td><td><a href="/workers?address=${encodeURIComponent(x.address)}">${x.worker_count}</a></td><td>${x.accepted_shares||0}</td><td>${x.rejected_shares||0}</td><td>${coin(x.balance_atomic)}</td><td>${coin(x.immature_balance_atomic)}</td><td>${coin(x.total_paid_atomic)}</td></tr>`))}
function renderPayouts(p){if(!p.length)return'<div class="empty">No payouts yet.</div>';return table(['ID','Status','Total','Created','TXID'],p.map(x=>`<tr><td><a href="/payouts#${x.id}">#${x.id}</a></td><td>${status(x.status)}</td><td>${coin(x.total_atomic)} YERB</td><td>${when(x.created_at)}</td><td>${explorerTx(x.txid)}</td></tr>`))}
async function miners(){const m=await get('/api/miners?limit=1000');app.innerHTML=`<section><h2>Miners</h2><div class="muted">Payout-address accounts tracked by the pool.</div>${renderMiners(m)}</section>`}
async function workers(){let w=await get('/api/workers?limit=1000');const q=new URLSearchParams(location.search),a=q.get('address');if(a)w=w.filter(x=>x.address===a);if(!w.length){app.innerHTML=`<section><h2>Workers</h2>${a?`<div class="muted">Address: ${addressLink(a)}</div>`:''}<div class="empty">No workers found.</div></section>`;return}const groups=new Map();for(const x of w){if(!groups.has(x.address))groups.set(x.address,[]);groups.get(x.address).push(x)}const rows=[];for(const[address,items]of groups){items.sort((x,y)=>Number(y.active)-Number(x.active)||Number(y.hashrate||0)-Number(x.hashrate||0));items.forEach((x,i)=>rows.push(`<tr>${i===0?`<td class="address-cell" rowspan="${items.length}">${addressLink(address)}<div class="small">${explorerAddress(address)}</div><div class="small muted">${items.length} worker${items.length===1?'':'s'}</div></td>`:''}<td><a href="/worker/${x.id}"><code>${esc(x.name)}</code></a></td><td>${x.active?'<span class="ok">Active</span>':'<span class="muted">Idle</span>'}</td><td>${hashRate(x.hashrate)}</td><td>${x.accepted_shares}</td><td>${x.rejected_shares}</td><td>${ago(x.last_share_at)}</td><td>${ago(x.last_seen_at)}</td></tr>`))}app.innerHTML=`<section><h2>Workers</h2>${a?`<div class="muted">Address: ${addressLink(a)}</div>`:''}${table(['Address','Worker','Status','Estimated Hashrate','Accepted','Rejected','Last Share','Last Seen'],rows)}</section>`}
async function worker(){const id=location.pathname.slice('/worker/'.length),x=await get('/api/worker/'+encodeURIComponent(id)+'/stats?hours=24&bucket=300'),h=x.history||[],latest=h.slice(-2).reduce((s,v)=>s+Number(v.hashrate||0),0)/Math.max(1,Math.min(2,h.length));app.innerHTML=`<a class="back" href="/workers">← Workers</a><section><div class="section-head"><div><h2 style="margin-bottom:5px">${esc(x.name)}</h2><div>${addressLink(x.address)}</div></div><div>${x.active?'<span class="ok">Active</span>':'<span class="muted">Idle</span>'}</div></div><div class="grid" style="margin-top:18px"><div class="card"><div class="muted">Recent Hashrate</div><div class="value">${hashRate(latest)}</div></div><div class="card"><div class="muted">Accepted Shares</div><div class="value">${x.accepted_shares||0}</div></div><div class="card"><div class="muted">Rejected Shares</div><div class="value">${x.rejected_shares||0}</div></div><div class="card"><div class="muted">Last Seen</div><div class="value" style="font-size:20px">${ago(x.last_seen_at)}</div></div></div></section><section><div class="chart-grid"><div class="chart-card"><h3>Hashrate — last 24 hours</h3><div class="muted small">Estimated from accepted GhostRider share difficulty.</div>${lineChart(h,'hashrate',hashRate)}</div><div class="chart-card"><h3>Share activity — last 24 hours</h3>${shareChart(h)}<div class="legend"><span><i class="dot okdot"></i>Accepted</span><span><i class="dot baddot"></i>Rejected</span></div></div></div></section>`}
async function shares(){const q=new URLSearchParams(location.search),statusQ=q.get('status'),address=q.get('address'),params=new URLSearchParams({limit:'1000'});if(statusQ)params.set('status',statusQ);if(address)params.set('address',address);const s=await get('/api/shares?'+params);app.innerHTML=`<section><h2>${statusQ?statusQ[0].toUpperCase()+statusQ.slice(1)+' ':''}Shares</h2>${address?`<div class="muted">Address: ${addressLink(address)}</div>`:''}${s.length?table(['Time','Address / Worker','Difficulty','Result','Block Candidate','Hash'],s.map(x=>`<tr><td>${when(x.ts)}</td><td>${x.address?addressLink(x.address):''}<div><code>${esc(x.worker)}</code></div></td><td>${Number(x.difficulty).toExponential(4)}</td><td>${x.accepted?'<span class="ok">Accepted</span>':'<span class="bad">Rejected</span>'}</td><td>${x.block_candidate?'Yes':'No'}</td><td><code>${esc(short(x.hash))}</code></td></tr>`)):'<div class="empty">No shares recorded.</div>'}</section>`}
async function blocks(){const pending=location.pathname==='/blocks/pending',b=await get('/api/blocks?limit=500'+(pending?'&status=pending':''));app.innerHTML=`<section><h2>${pending?'Pending Blocks':'Blocks'}</h2>${renderBlocks(b)}</section>`}
async function payouts(){const p=await get('/api/payouts?limit=500');app.innerHTML=`<section><h2>Payouts</h2>${renderPayouts(p)}</section>`}
async function account(){const a=decodeURIComponent(location.pathname.slice('/account/'.length)),x=await get('/api/account/'+encodeURIComponent(a)),stats=await Promise.all((x.workers||[]).map(w=>get('/api/worker/'+w.id+'/stats?hours=24&bucket=300').catch(()=>null))),h=aggregateHistory(stats.filter(Boolean)),latest=h.slice(-2).reduce((s,v)=>s+Number(v.hashrate||0),0)/Math.max(1,Math.min(2,h.length));app.innerHTML=`<a class="back" href="/miners">← Miners</a><section><h2>Miner Account</h2><div>${addressLink(x.address)} &nbsp; ${explorerAddress(x.address)}</div><div class="grid" style="margin-top:18px"><div class="card"><div class="muted">Balance</div><div class="value">${coin(x.balance_atomic)}</div><div>YERB</div></div><div class="card"><div class="muted">Immature</div><div class="value">${coin(x.immature_balance_atomic)}</div><div>YERB</div></div><div class="card"><div class="muted">Total Earned</div><div class="value">${coin(x.total_earned_atomic)}</div><div>YERB</div></div><div class="card"><div class="muted">Total Paid</div><div class="value">${coin(x.total_paid_atomic)}</div><div>YERB</div></div><div class="card"><div class="muted">Combined Hashrate</div><div class="value">${hashRate(latest)}</div></div></div></section><section><h2>Worker Statistics — last 24 hours</h2>${h.length?`<div class="chart-grid"><div class="chart-card"><h3>Combined Hashrate</h3>${lineChart(h,'hashrate',hashRate)}</div><div class="chart-card"><h3>Share Activity</h3>${shareChart(h)}</div></div>`:'<div class="empty">No worker history recorded yet.</div>'}</section><section><h2>Workers</h2>${x.workers.length?table(['Worker','Accepted','Rejected','Last Seen'],x.workers.map(w=>`<tr><td><a href="/worker/${w.id}"><code>${esc(w.name)}</code></a></td><td>${w.accepted_shares}</td><td>${w.rejected_shares}</td><td>${ago(w.last_seen_at)}</td></tr>`)):'<div class="empty">No workers.</div>'}</section><section><h2>Ledger</h2>${x.ledger.length?table(['Time','Type','Amount','Block','Note'],x.ledger.map(l=>`<tr><td>${when(l.ts)}</td><td>${status(l.entry_type)}</td><td>${coin(l.amount_atomic)} YERB</td><td>${l.block_id??'—'}</td><td>${esc(l.note||'')}</td></tr>`)):'<div class="empty">No ledger entries.</div>'}</section><section><h2>Payout History</h2>${x.payouts.length?table(['ID','Status','Amount','Sent','TXID'],x.payouts.map(p=>`<tr><td>#${p.id}</td><td>${status(p.status)}</td><td>${coin(p.amount_atomic)} YERB</td><td>${when(p.sent_at)}</td><td>${explorerTx(p.txid)}</td></tr>`)):'<div class="empty">No payouts.</div>'}</section>`}
async function route(){try{const p=location.pathname;if(p==='/')return dashboard();if(p==='/miners')return miners();if(p==='/workers')return workers();if(p==='/shares')return shares();if(p==='/blocks'||p==='/blocks/pending')return blocks();if(p==='/payouts')return payouts();if(p.startsWith('/account/'))return account();if(p.startsWith('/worker/'))return worker();app.innerHTML='<div class="empty">Page not found.</div>'}catch(e){app.innerHTML=`<div class="empty bad">${esc(e.message)}</div>`}}
route();if(location.pathname==='/')setInterval(dashboard,10000);if(location.pathname.startsWith('/worker/'))setInterval(worker,30000);if(location.pathname.startsWith('/account/'))setInterval(account,30000);
</script>
