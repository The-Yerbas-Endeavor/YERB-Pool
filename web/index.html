<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YERB Pool</title><style>body{font-family:system-ui,sans-serif;background:#111;color:#eee;margin:0}header{padding:24px;background:#181818;border-bottom:1px solid #2a2a2a}main{max-width:1200px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#1b1b1b;padding:18px;border:1px solid #2c2c2c;border-radius:10px}.value{font-size:28px;font-weight:700}.muted{color:#aaa}table{width:100%;border-collapse:collapse;margin-top:12px;background:#181818}th,td{padding:10px;border-bottom:1px solid #2a2a2a;text-align:left;font-size:14px}section{margin-top:26px}code{font-size:12px;word-break:break-all}</style></head><body><header><h1>YERB Pool</h1><div class="muted">GhostRider Mining Pool Dashboard</div></header><main><div id="cards" class="grid"></div><section><h2>Recent Blocks</h2><table><thead><tr><th>Height</th><th>Status</th><th>Confirmations</th><th>Reward</th><th>Hash</th></tr></thead><tbody id="blocks"></tbody></table></section><section><h2>Miners</h2><table><thead><tr><th>Address</th><th>Workers</th><th>Balance</th><th>Immature</th><th>Total Paid</th></tr></thead><tbody id="miners"></tbody></table></section><section><h2>Recent Payouts</h2><table><thead><tr><th>ID</th><th>Status</th><th>Total</th><th>TXID</th></tr></thead><tbody id="payouts"></tbody></table></section></main><script>const coin=n=>(Number(n||0)/1e8).toFixed(8);async function get(u){return fetch(u,{cache:'no-store'}).then(r=>r.json())}async function refresh(){const[s,b,m,p]=await Promise.all([get('/api/summary'),get('/api/blocks'),get('/api/miners'),get('/api/payouts')]);document.getElementById('cards').innerHTML=[['Miners',s.accounts.accounts],['Active Workers',s.workers.active_workers],['Accepted Shares',s.shares.accepted],['Rejected Shares',s.shares.rejected],['Blocks Found',s.blocks.blocks],['Pending Blocks',s.blocks.pending],['Pool Balance',coin(s.accounts.balance_atomic)+' YERB'],['Immature',coin(s.accounts.immature_atomic)+' YERB'],['Total Paid',coin(s.payouts.paid_atomic)+' YERB']].map(x=>`<div class=card><div class=muted>${x[0]}</div><div class=value>${x[1]}</div></div>`).join('');document.getElementById('blocks').innerHTML=b.map(x=>`<tr><td>${x.height??''}</td><td>${x.status}</td><td>${x.confirmations}</td><td>${coin(x.reward_atomic)}</td><td><code>${x.block_hash||''}</code></td></tr>`).join('');document.getElementById('miners').innerHTML=m.map(x=>`<tr><td><code>${x.address}</code></td><td>${x.worker_count}</td><td>${coin(x.balance_atomic)}</td><td>${coin(x.immature_balance_atomic)}</td><td>${coin(x.total_paid_atomic)}</td></tr>`).join('');document.getElementById('payouts').innerHTML=p.map(x=>`<tr><td>${x.id}</td><td>${x.status}</td><td>${coin(x.total_atomic)}</td><td><code>${x.txid||''}</code></td></tr>`).join('')}refresh();setInterval(refresh,10000)</script></body></html>
