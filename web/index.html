<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YERB Pool</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#111;color:#eee;margin:0}a{color:#9fd3ff;text-decoration:none}a:hover{text-decoration:underline}header{padding:24px;background:#181818;border-bottom:1px solid #2a2a2a}.head{max-width:1200px;margin:auto}.brand{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}nav{display:flex;gap:16px;flex-wrap:wrap}nav a{color:#ddd;font-weight:600}.muted{color:#aaa}.small{font-size:12px}main{max-width:1200px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{display:block;background:#1b1b1b;padding:18px;border:1px solid #2c2c2c;border-radius:10px;color:#eee;transition:.15s ease}.card:hover{border-color:#555;transform:translateY(-1px);text-decoration:none}.card .muted{margin-bottom:4px}.value{font-size:28px;font-weight:700}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center}table{width:100%;border-collapse:collapse;margin-top:12px;background:#181818}th,td{padding:10px;border-bottom:1px solid #2a2a2a;text-align:left;font-size:14px;vertical-align:top}section{margin-top:26px}.table-wrap{overflow-x:auto}code{font-size:12px;word-break:break-all}.badge{display:inline-block;padding:3px 8px;border-radius:999px;border:1px solid #444;background:#222;font-size:12px}.ok{color:#9fe3a7}.bad{color:#ffaaaa}.copy{font-size:11px;margin-left:6px;background:#252525;border:1px solid #444;border-radius:5px;color:#ddd;padding:2px 6px;cursor:pointer}.empty{padding:18px;color:#888;background:#181818;border:1px solid #252525;border-radius:8px}.back{display:inline-block;margin-bottom:14px}
</style>
</head>
<body>
<header><div class="head"><div class="brand"><div><h1><a href="/" style="color:#eee">YERB Pool</a></h1><div class="muted">GhostRider Mining Pool Dashboard</div></div><nav><a href="/">Dashboard</a><a href="/miners">Miners</a><a href="/workers">Workers</a><a href="/shares">Shares</a><a href="/blocks">Blocks</a><a href="/payouts">Payouts</a><a href="/api/summary">API</a></nav></div></div></header>
<main id="app"></main>
<script>
const EXPLORER='https://explorer.yerbas.org';
const coin=n=>(Number(n||0)/1e8).toFixed(8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=s=>{s=String(s||'');return s.length>22?s.slice(0,10)+'…'+s.slice(-10):s};
const when=t=>t?new Date(Number(t)*1000).toLocaleString():'—';
const ago=t=>{if(!t)return 'never';const d=Math.max(0,Math.floor(Date.now()/1000-Number(t)));if(d<60)return d+'s ago';if(d<3600)return Math.floor(d/60)+'m ago';if(d<86400)return Math.floor(d/3600)+'h ago';return Math.floor(d/86400)+'d ago'};
async function get(u){const r=await fetch(u,{cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);return j}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function status(x){return `<span class="badge">${esc(x||'')}</span>`}
function copyBtn(v){return `<button class="copy" onclick="navigator.clipboard.writeText('${String(v).replace(/'/g,"\\'")}');this.textContent='Copied'">Copy</button>`}
function addressLink(a){return `<a href="/account/${encodeURIComponent(a)}"><code>${esc(a)}</code></a>${copyBtn(a)}`}
function explorerAddress(a){return `<a href="${EXPLORER}/address/${encodeURIComponent(a)}" target="_blank" rel="noopener">Explorer ↗</a>`}
function explorerBlock(h){return h?`<a href="${EXPLORER}/block/${encodeURIComponent(h)}" target="_blank" rel="noopener"><code>${esc(short(h))}</code></a>`:'—'}
function explorerTx(tx){return tx?`<a href="${EXPLORER}/tx/${encodeURIComponent(tx)}" target="_blank" rel="noopener"><code>${esc(short(tx))}</code></a>`:'—'}
function hashRate(v){v=Number(v||0);if(v>=1e9)return(v/1e9).toFixed(2)+' GH/s';if(v>=1e6)return(v/1e6).toFixed(2)+' MH/s';if(v>=1e3)return(v/1e3).toFixed(2)+' kH/s';return v.toFixed(1)+' H/s'}

async function dashboard(){const[s,b,m,p]=await Promise.all([get('/api/summary'),get('/api/blocks?limit=10'),get('/api/miners?limit=10'),get('/api/payouts?limit=10')]);const cards=[['Miners',s.accounts.accounts,'/miners'],['Active Workers',s.workers.active_workers,'/workers'],['Accepted Shares',s.shares.accepted,'/shares?status=accepted'],['Rejected Shares',s.shares.rejected,'/shares?status=rejected'],['Blocks Found',s.blocks.blocks,'/blocks'],['Pending Blocks',s.blocks.pending,'/blocks/pending'],['Pool Balance',coin(s.accounts.balance_atomic)+' YERB','/miners'],['Immature',coin(s.accounts.immature_atomic)+' YERB','/miners'],['Total Paid',coin(s.payouts.paid_atomic)+' YERB','/payouts']];app.innerHTML=`<div class="grid">${cards.map(x=>`<a class="card" href="${x[2]}"><div class="muted">${x[0]}</div><div class="value">${x[1]}</div></a>`).join('')}</div><section><div class="section-head"><h2>Recent Blocks</h2><a href="/blocks">View all →</a></div>${renderBlocks(b)}</section><section><div class="section-head"><h2>Miners</h2><a href="/miners">View all →</a></div>${renderMiners(m)}</section><section><div class="section-head"><h2>Recent Payouts</h2><a href="/payouts">View all →</a></div>${renderPayouts(p)}</section>`}
function renderBlocks(b){if(!b.length)return'<div class="empty">No blocks found yet.</div>';return table(['Height','Status','Confirmations','Reward','Hash'],b.map(x=>`<tr><td>${x.height??'—'}</td><td>${status(x.status)}</td><td>${x.confirmations??0}</td><td>${coin(x.reward_atomic)} YERB</td><td>${explorerBlock(x.block_hash)}</td></tr>`))}
function renderMiners(m){if(!m.length)return'<div class="empty">No miners yet.</div>';return table(['Address','Workers','Accepted','Rejected','Balance','Immature','Total Paid'],m.map(x=>`<tr><td>${addressLink(x.address)}<div class="small">${explorerAddress(x.address)}</div></td><td><a href="/workers?address=${encodeURIComponent(x.address)}">${x.worker_count}</a></td><td>${x.accepted_shares||0}</td><td>${x.rejected_shares||0}</td><td>${coin(x.balance_atomic)}</td><td>${coin(x.immature_balance_atomic)}</td><td>${coin(x.total_paid_atomic)}</td></tr>`))}
function renderPayouts(p){if(!p.length)return'<div class="empty">No payouts yet.</div>';return table(['ID','Status','Total','Created','TXID'],p.map(x=>`<tr><td><a href="/payouts#${x.id}">#${x.id}</a></td><td>${status(x.status)}</td><td>${coin(x.total_atomic)} YERB</td><td>${when(x.created_at)}</td><td>${explorerTx(x.txid)}</td></tr>`))}
async function miners(){const m=await get('/api/miners?limit=1000');app.innerHTML=`<section><h2>Miners</h2><div class="muted">Payout-address accounts tracked by the pool.</div>${renderMiners(m)}</section>`}
async function workers(){let w=await get('/api/workers?limit=1000');const q=new URLSearchParams(location.search);const a=q.get('address');if(a)w=w.filter(x=>x.address===a);app.innerHTML=`<section><h2>Workers</h2>${a?`<div class="muted">Address: ${addressLink(a)}</div>`:''}${w.length?table(['Address','Worker','Status','Estimated Hashrate','Accepted','Rejected','Last Share','Last Seen'],w.map(x=>`<tr><td>${addressLink(x.address)}</td><td><a href="/shares?address=${encodeURIComponent(x.address)}"><code>${esc(x.name)}</code></a></td><td>${x.active?'<span class="ok">Active</span>':'<span class="muted">Idle</span>'}</td><td>${hashRate(x.hashrate)}</td><td>${x.accepted_shares}</td><td>${x.rejected_shares}</td><td>${ago(x.last_share_at)}</td><td>${ago(x.last_seen_at)}</td></tr>`)):'<div class="empty">No workers found.</div>'}</section>`}
async function shares(){const q=new URLSearchParams(location.search);const statusQ=q.get('status');const address=q.get('address');const params=new URLSearchParams({limit:'1000'});if(statusQ)params.set('status',statusQ);if(address)params.set('address',address);const s=await get('/api/shares?'+params);app.innerHTML=`<section><h2>${statusQ?statusQ[0].toUpperCase()+statusQ.slice(1)+' ':''}Shares</h2>${address?`<div class="muted">Address: ${addressLink(address)}</div>`:''}${s.length?table(['Time','Address / Worker','Difficulty','Result','Block Candidate','Hash'],s.map(x=>`<tr><td>${when(x.ts)}</td><td>${x.address?addressLink(x.address):''}<div><code>${esc(x.worker)}</code></div></td><td>${Number(x.difficulty).toExponential(4)}</td><td>${x.accepted?'<span class="ok">Accepted</span>':'<span class="bad">Rejected</span>'}</td><td>${x.block_candidate?'Yes':'No'}</td><td><code>${esc(short(x.hash))}</code></td></tr>`)):'<div class="empty">No shares recorded.</div>'}</section>`}
async function blocks(){const pending=location.pathname==='/blocks/pending';const b=await get('/api/blocks?limit=500'+(pending?'&status=pending':''));app.innerHTML=`<section><h2>${pending?'Pending Blocks':'Blocks'}</h2>${renderBlocks(b)}</section>`}
async function payouts(){const p=await get('/api/payouts?limit=500');app.innerHTML=`<section><h2>Payouts</h2>${renderPayouts(p)}</section>`}
async function account(){const a=decodeURIComponent(location.pathname.slice('/account/'.length));const x=await get('/api/account/'+encodeURIComponent(a));app.innerHTML=`<a class="back" href="/miners">← Miners</a><section><h2>Miner Account</h2><div>${addressLink(x.address)} &nbsp; ${explorerAddress(x.address)}</div><div class="grid" style="margin-top:18px"><div class="card"><div class="muted">Balance</div><div class="value">${coin(x.balance_atomic)}</div><div>YERB</div></div><div class="card"><div class="muted">Immature</div><div class="value">${coin(x.immature_balance_atomic)}</div><div>YERB</div></div><div class="card"><div class="muted">Total Earned</div><div class="value">${coin(x.total_earned_atomic)}</div><div>YERB</div></div><div class="card"><div class="muted">Total Paid</div><div class="value">${coin(x.total_paid_atomic)}</div><div>YERB</div></div></div></section><section><h2>Workers</h2>${x.workers.length?table(['Worker','Accepted','Rejected','Last Seen'],x.workers.map(w=>`<tr><td><a href="/shares?address=${encodeURIComponent(x.address)}"><code>${esc(w.name)}</code></a></td><td>${w.accepted_shares}</td><td>${w.rejected_shares}</td><td>${ago(w.last_seen_at)}</td></tr>`)):'<div class="empty">No workers.</div>'}</section><section><h2>Ledger</h2>${x.ledger.length?table(['Time','Type','Amount','Block','Note'],x.ledger.map(l=>`<tr><td>${when(l.ts)}</td><td>${status(l.entry_type)}</td><td>${coin(l.amount_atomic)} YERB</td><td>${l.block_id??'—'}</td><td>${esc(l.note||'')}</td></tr>`)):'<div class="empty">No ledger entries.</div>'}</section><section><h2>Payout History</h2>${x.payouts.length?table(['ID','Status','Amount','Sent','TXID'],x.payouts.map(p=>`<tr><td>#${p.id}</td><td>${status(p.status)}</td><td>${coin(p.amount_atomic)} YERB</td><td>${when(p.sent_at)}</td><td>${explorerTx(p.txid)}</td></tr>`)):'<div class="empty">No payouts.</div>'}</section>`}
async function route(){try{const p=location.pathname;if(p==='/')return dashboard();if(p==='/miners')return miners();if(p==='/workers')return workers();if(p==='/shares')return shares();if(p==='/blocks'||p==='/blocks/pending')return blocks();if(p==='/payouts')return payouts();if(p.startsWith('/account/'))return account();app.innerHTML='<div class="empty">Page not found.</div>'}catch(e){app.innerHTML=`<div class="empty bad">${esc(e.message)}</div>`}}
route();
if(location.pathname==='/')setInterval(dashboard,10000);
</script>
</body>
</html>
